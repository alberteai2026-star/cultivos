[project]
name = "cultivos-api"
version = "0.1.0"
description = "API inicial del sistema integral de cultivos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.2.0",
  "pymysql>=1.1.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2.0"
]
